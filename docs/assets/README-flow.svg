<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#080a12"/><stop offset="1" stop-color="#171226"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#ff6b3d"/><stop offset="1" stop-color="#ffb36b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".5"/></filter><style>.box{fill:#ffffff08;stroke:#ffffff1c}.t{font:600 22px Arial;fill:#fff}.s{font:15px Arial;fill:#9ea8bb}.a{stroke:url(#g);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:10 14;animation:d 2s linear infinite}@keyframes d{to{stroke-dashoffset:-48}}.p{animation:p 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes p{50%{opacity:.55;transform:scale(1.06)}}</style></defs><rect width="1400" height="520" rx="32" fill="url(#b)"/><text x="70" y="70" class="t" font-size="28">How LaaWa turns a conversation into an operation</text><text x="70" y="102" class="s">A simple mental model for the platform.</text><g filter="url(#s)"><rect x="70" y="170" width="230" height="190" rx="26" class="box"/><rect x="390" y="170" width="230" height="190" rx="26" class="box"/><rect x="710" y="170" width="230" height="190" rx="26" class="box"/><rect x="1030" y="170" width="300" height="190" rx="26" class="box"/></g><g><circle cx="115" cy="215" r="10" fill="#6ef0b3" class="p"/><text x="100" y="265" class="t">1 · Message</text><text x="100" y="298" class="s">WhatsApp conversation</text><text x="100" y="322" class="s">becomes durable data.</text><path d="M300 265H390" class="a"/><circle cx="435" cy="215" r="10" fill="#8e7cff" class="p"/><text x="420" y="265" class="t">2 · Understand</text><text x="420" y="298" class="s">Customer context + AI</text><text x="420" y="322" class="s">shape the next action.</text><path d="M620 265H710" class="a"/><circle cx="755" cy="215" r="10" fill="#ff8a55" class="p"/><text x="740" y="265" class="t">3 · Automate</text><text x="740" y="298" class="s">Rules, workflows and</text><text x="740" y="322" class="s">durable jobs execute.</text><path d="M940 265H1030" class="a"/><circle cx="1075" cy="215" r="10" fill="#ffd36a" class="p"/><text x="1060" y="265" class="t">4 · Operate</text><text x="1060" y="298" class="s">Observe, notify, integrate</text><text x="1060" y="322" class="s">and improve the system.</text></g><text x="700" y="435" text-anchor="middle" class="s">MESSAGE → CONTEXT → ACTION → OBSERVABILITY</text></svg>